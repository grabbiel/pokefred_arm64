name: pixel_pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Linux x86_64
        run: uname -m | grep -qx x86_64
      - name: Scalar make test
        run: |
          cd tools/pixel_pipeline
          make
          make test
